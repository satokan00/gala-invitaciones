<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <title>Fiesta Gala Cuartos Medios 2026</title>
  <style>
    :root { color-scheme: light; --navy:#102b4e; --gold:#c8a45d; --ink:#263244; --muted:#687386; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#eef2f7,#f8f4eb); font-family:Arial,Helvetica,sans-serif; color:var(--ink); }
    main { width:min(100%,480px); overflow:hidden; background:#fff; border:1px solid #e6e0d4; border-radius:22px; box-shadow:0 18px 55px rgba(16,43,78,.13); }
    header { padding:28px 24px 24px; text-align:center; color:#fff; background:var(--navy); border-bottom:5px solid var(--gold); }
    .eyebrow { margin:0 0 9px; color:#e3cb99; letter-spacing:.16em; font-size:11px; font-weight:700; text-transform:uppercase; }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(25px,6vw,32px); font-weight:600; }
    .subtitle { margin:9px 0 0; color:#e7edf5; font-size:14px; }
    section { padding:28px 26px 30px; }
    .status { display:inline-block; margin-bottom:18px; padding:7px 11px; border-radius:999px; background:#f5eddb; color:#765d2e; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
    .field { padding:15px 0; border-bottom:1px solid #edf0f3; }
    .field:last-child { border-bottom:0; }
    .label { display:block; margin-bottom:7px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .value { display:block; color:var(--navy); font-family:Georgia,serif; font-size:clamp(20px,5vw,25px); line-height:1.3; overflow-wrap:anywhere; }
    footer { padding:15px 24px; background:#faf9f6; color:#7a8290; text-align:center; font-size:11px; }
    .message { color:var(--muted); font-size:15px; line-height:1.6; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Colegio Plus Ultra</p>
      <h1>Fiesta Gala 2026</h1>
      <p class="subtitle">Cuartos Medios</p>
    </header>
    <section id="result" hidden>
      <span class="status">Invitación identificada</span>
      <div class="field">
        <span class="label">Nombre del estudiante</span>
        <strong class="value" id="student-name"></strong>
      </div>
      <div class="field" id="course-field" hidden>
        <span class="label">Curso</span>
        <strong class="value" id="student-course"></strong>
      </div>
    </section>
    <section id="message-section">
      <p class="message" id="message">Abre esta página desde el enlace QR de una invitación para consultar sus datos.</p>
    </section>
    <footer>Viernes 13 de noviembre de 2026 · 20:00 a 24:00</footer>
  </main>
  <script>
    (() => {
      const message = document.getElementById('message');
      const result = document.getElementById('result');
      const messageSection = document.getElementById('message-section');

      function decodePayload(token) {
        const base64 = token.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        return JSON.parse(new TextDecoder('utf-8').decode(bytes));
      }

      const token = window.location.hash.slice(1);
      if (!token) return;

      try {
        const data = decodePayload(token);
        if (!data || typeof data.name !== 'string' || !data.name.trim()) {
          throw new Error('Datos incompletos');
        }
        document.getElementById('student-name').textContent = data.name;
        if (typeof data.course === 'string' && data.course.trim()) {
          document.getElementById('student-course').textContent = data.course;
          document.getElementById('course-field').hidden = false;
        }
        result.hidden = false;
        messageSection.hidden = true;
        document.title = 'Invitación - ' + data.name;
      } catch (error) {
        message.textContent = 'No se pudieron leer los datos de esta invitación. Verifica que el QR corresponda a esta página.';
      }
    })();
  </script>
</body>
</html>
