<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <meta name="description" content="Consulta los datos de tu invitación a la Fiesta Gala Cuartos Medios 2026 del Colegio Plus Ultra.">
  <title>Fiesta Gala Cuartos Medios 2026</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #102b4e;
      --navy-deep: #0b1d38;
      --gold: #d4ad62;
      --gold-light: #f4e5bd;
      --ink: #263244;
      --muted: #687386;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 13%, rgba(212,173,98,.18), transparent 24%),
        radial-gradient(circle at 88% 84%, rgba(16,43,78,.10), transparent 27%),
        linear-gradient(145deg, #eef2f7 0%, #fbf8f0 52%, #f1ecdf 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
    }
    main {
      position: relative;
      isolation: isolate;
      width: min(100%, 480px);
      overflow: hidden;
      background: #fff;
      border: 1px solid #e6e0d4;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(16,43,78,.16), 0 3px 12px rgba(16,43,78,.06);
    }
    header {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 27px 24px 25px;
      text-align: center;
      color: #fff;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 58%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-deep) 100%);
      border-bottom: 5px solid var(--gold);
    }
    .logo-wrap {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 98px;
      height: 98px;
      margin: 0 auto 15px;
      padding: 5px;
      border: 2px solid rgba(232,196,119,.95);
      border-radius: 50%;
      background: rgba(255,255,255,.97);
      box-shadow: 0 0 0 5px rgba(212,173,98,.13), 0 8px 22px rgba(0,0,0,.22);
    }
    .logo-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .eyebrow {
      position: relative;
      z-index: 2;
      margin: 0 0 8px;
      color: var(--gold-light);
      letter-spacing: .17em;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(25px, 6vw, 33px);
      font-weight: 600;
      letter-spacing: .015em;
      text-shadow: 0 2px 12px rgba(0,0,0,.18);
    }
    .subtitle { position: relative; z-index: 2; margin: 9px 0 0; color: #e7edf5; font-size: 14px; letter-spacing: .04em; }
    section { position: relative; z-index: 1; padding: 28px 26px 30px; }
    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border: 1px solid #ead9b5;
      border-radius: 999px;
      background: #fbf5e8;
      color: #765d2e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .field { padding: 15px 0; border-bottom: 1px solid #edf0f3; }
    .field:last-child { border-bottom: 0; }
    .label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .value { display: block; color: var(--navy); font-family: Georgia, serif; font-size: clamp(20px, 5vw, 25px); line-height: 1.3; overflow-wrap: anywhere; }
    footer { position: relative; z-index: 1; padding: 16px 20px; border-top: 1px solid #eee8dc; background: #faf9f6; color: #777f8d; text-align: center; font-size: 11px; letter-spacing: .02em; }
    .message { color: var(--muted); font-size: 15px; line-height: 1.65; text-align: center; }
    [hidden] { display: none !important; }

    /* Destellos dorados discretos: decorativos y no interfieren con el QR. */
    .sparkle {
      position: absolute;
      z-index: 1;
      color: #f0d18d;
      line-height: 1;
      pointer-events: none;
      opacity: .78;
      text-shadow: 0 0 8px rgba(244,220,165,.55);
      animation: twinkle 3.8s ease-in-out infinite;
    }
    .s1 { top: 25px; left: 9%; font-size: 19px; animation-delay: .1s; }
    .s2 { top: 68px; right: 11%; font-size: 14px; animation-delay: 1.2s; }
    .s3 { top: 164px; left: 15%; font-size: 12px; animation-delay: 2s; }
    .s4 { top: 144px; right: 17%; font-size: 18px; animation-delay: .7s; }
    .s5 { top: 18px; right: 29%; font-size: 10px; animation-delay: 2.4s; }
    .s6 { bottom: 20px; left: 28%; font-size: 11px; animation-delay: 1.6s; }
    @keyframes twinkle {
      0%, 100% { opacity: .34; transform: scale(.82) rotate(0deg); }
      50% { opacity: .95; transform: scale(1.15) rotate(18deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle { animation: none; opacity: .65; }
    }
    @media (max-width: 360px) {
      body { padding: 14px 10px; }
      header { padding: 23px 17px 22px; }
      section { padding: 24px 20px 26px; }
      .logo-wrap { width: 88px; height: 88px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="sparkle s1" aria-hidden="true">✦</span>
      <span class="sparkle s2" aria-hidden="true">✧</span>
      <span class="sparkle s3" aria-hidden="true">✧</span>
      <span class="sparkle s4" aria-hidden="true">✦</span>
      <span class="sparkle s5" aria-hidden="true">✧</span>
      <span class="sparkle s6" aria-hidden="true">✦</span>
      <div class="logo-wrap">
        <img src="logo-colegio.png" alt="Logo del Colegio Plus Ultra" width="300" height="300">
      </div>
      <p class="eyebrow">Colegio Plus Ultra</p>
      <h1>Fiesta Gala 2026</h1>
      <p class="subtitle">Cuartos Medios</p>
    </header>
    <section id="result" hidden>
      <span class="status">✦ Invitación identificada ✦</span>
      <div class="field">
        <span class="label">Nombre del estudiante</span>
        <strong class="value" id="student-name"></strong>
      </div>
      <div class="field" id="course-field" hidden>
        <span class="label">Curso</span>
        <strong class="value" id="student-course"></strong>
      </div>
    </section>
    <section id="message-section">
      <p class="message" id="message">Abre esta página desde el enlace QR de una invitación para consultar sus datos.</p>
    </section>
    <footer>Viernes 13 de noviembre de 2026 · 20:00 a 24:00</footer>
  </main>
  <script>
    (() => {
      const message = document.getElementById('message');
      const result = document.getElementById('result');
      const messageSection = document.getElementById('message-section');

      function decodePayload(token) {
        const base64 = token.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        return JSON.parse(new TextDecoder('utf-8').decode(bytes));
      }

      const token = window.location.hash.slice(1);
      if (!token) return;

      try {
        const data = decodePayload(token);
        if (!data || typeof data.name !== 'string' || !data.name.trim()) {
          throw new Error('Datos incompletos');
        }
        document.getElementById('student-name').textContent = data.name;
        if (typeof data.course === 'string' && data.course.trim()) {
          document.getElementById('student-course').textContent = data.course;
          document.getElementById('course-field').hidden = false;
        }
        result.hidden = false;
        messageSection.hidden = true;
        document.title = 'Invitación - ' + data.name;
      } catch (error) {
        message.textContent = 'No se pudieron leer los datos de esta invitación. Verifica que el QR corresponda a esta página.';
      }
    })();
  </script>
</body>
</html>
